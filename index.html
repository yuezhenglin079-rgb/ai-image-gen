<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 绘 - AI 图片生成</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#08080d;color:#e4e4ed;min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:#818cf8;text-decoration:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#0d0d14}::-webkit-scrollbar-thumb{background:#25253a;border-radius:3px}
.container{max-width:1180px;margin:0 auto;padding:0 20px}
header{background:rgba(8,8,13,.85);border-bottom:1px solid #16161f;position:sticky;top:0;z-index:100;padding:12px 0;backdrop-filter:blur(14px)}
header .container{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;color:#e4e4ed}
.logo-icon{width:30px;height:30px;background:linear-gradient(135deg,#818cf8,#6366f1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0}
.logo small{font-size:11px;font-weight:400;color:#5a5a70;margin-left:2px}
.header-right{display:flex;align-items:center;gap:10px}
.header-right .btn-outline{padding:7px 14px;background:#16161f;border:1px solid #2a2a3a;border-radius:8px;color:#9d9db5;font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s}
.header-right .btn-outline:hover{background:#1e1e2a;color:#e4e4ed;border-color:#3a3a4a}
.header-right .btn-primary{background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;border:none;padding:7px 16px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:opacity .2s}
.header-right .btn-primary:hover{opacity:.85}
.user-badge{display:flex;align-items:center;gap:8px;font-size:12px;color:#9d9db5}
.user-badge .credits{background:#1a1a26;border:1px solid #2a2a3a;border-radius:6px;padding:3px 10px;font-size:11px;color:#a5b4fc}
.user-badge .credits strong{color:#e4e4ed}
.ad-banner{background:#0e0e18;border:1px dashed #1e1e2e;border-radius:10px;padding:12px;margin:14px auto;max-width:700px;display:flex;align-items:center;justify-content:center;min-height:60px;color:#3d3d55;font-size:11px;letter-spacing:.4px;text-align:center;cursor:pointer;transition:border-color .25s}
.ad-banner:hover{border-color:#2e2e44}
.page-layout{display:grid;grid-template-columns:340px 1fr;gap:24px;padding:20px 0 40px;align-items:start}
@media(max-width:860px){.page-layout{grid-template-columns:1fr}}
.controls-panel{background:#0d0d16;border:1px solid #1a1a26;border-radius:14px;padding:20px;position:sticky;top:70px}
.controls-panel h2{font-size:14px;font-weight:600;color:#c4c4d0;margin-bottom:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:500;color:#8a8aa0;margin-bottom:5px}
.model-options{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.model-btn{padding:7px 8px;border-radius:7px;background:#12121c;border:1px solid #1e1e2a;color:#7a7a90;font-size:11px;font-weight:500;cursor:pointer;transition:all .2s;text-align:center;line-height:1.3;font-family:inherit}
.model-btn:hover{background:#181826;color:#9d9db5}
.model-btn.active{background:linear-gradient(135deg,rgba(99,102,241,.2),rgba(129,140,248,.1));border-color:#4f46e5;color:#a5b4fc}
.model-btn small{display:block;font-size:10px;font-weight:400;color:#5a5a70;margin-top:1px}
.prompt-wrap textarea{width:100%;padding:10px 12px;min-height:85px;resize:vertical;background:#12121c;border:1px solid #1e1e2a;border-radius:8px;color:#e4e4ed;font-size:13px;font-family:inherit;line-height:1.5;outline:none;transition:border-color .25s}
.prompt-wrap textarea:focus{border-color:#4f46e5}
.prompt-wrap textarea::placeholder{color:#4a4a60}
.char-count{position:absolute;right:10px;bottom:7px;font-size:10px;color:#3d3d50;pointer-events:none}
.prompt-wrap{position:relative}
.size-options{display:flex;flex-wrap:wrap;gap:5px}
.size-btn{padding:5px 12px;border-radius:6px;background:#12121c;border:1px solid #1e1e2a;color:#6b6b80;font-size:11px;cursor:pointer;transition:all .2s;font-family:inherit}
.size-btn:hover{background:#181826;color:#9d9db5}
.size-btn.active{background:rgba(99,102,241,.15);border-color:#4f46e5;color:#a5b4fc}
.btn-generate{width:100%;padding:12px;background:linear-gradient(135deg,#6366f1,#818cf8);border:none;border-radius:9px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .25s;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:16px;font-family:inherit}
.btn-generate:hover{opacity:.9}
.btn-generate:disabled{opacity:.4;cursor:not-allowed}
.btn-generate .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none}
.btn-generate.loading .spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.results-panel{min-height:350px}
.empty-state{border:1px dashed #1a1a26;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:350px;color:#3d3d50;text-align:center;padding:20px}
.empty-state svg{width:40px;height:40px;margin-bottom:12px;opacity:.3}
.empty-state h3{font-size:15px;font-weight:600;color:#5a5a70;margin-bottom:3px}
.empty-state p{font-size:12px;color:#3d3d50}
.result-card{background:#0d0d16;border:1px solid #1a1a26;border-radius:14px;overflow:hidden}
.result-card .img-wrap{background:#0a0a0f;display:flex;align-items:center;justify-content:center;min-height:250px;position:relative}
.result-card .img-wrap img{max-width:100%;max-height:550px;display:block;object-fit:contain}
.result-card .meta{padding:12px 16px;border-top:1px solid #1a1a26;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:#5a5a70}
.result-card .meta .model-badge{padding:2px 7px;border-radius:4px;background:#12121c;border:1px solid #1e1e2a;font-size:10px;color:#7a7a90}
.result-card .actions button{padding:5px 12px;border-radius:6px;background:#12121c;border:1px solid #1e1e2a;color:#8a8aa0;font-size:11px;cursor:pointer;transition:all .2s;font-family:inherit}
.result-card .actions button:hover{background:#1a1a26;color:#a5b4fc;border-color:#2a2a3e}
.history-section{margin-top:20px}
.history-section h3{font-size:13px;font-weight:600;color:#7a7a90;margin-bottom:10px}
.history-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.history-grid .thumb{border-radius:6px;overflow:hidden;cursor:pointer;border:1px solid #1a1a26;transition:border-color .2s;aspect-ratio:1;position:relative}
.history-grid .thumb:hover{border-color:#3a3a50}
.history-grid .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.history-grid .thumb .thumb-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;color:#fff;font-size:11px}
.history-grid .thumb:hover .thumb-overlay{opacity:1}
.error-msg{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:10px 14px;color:#fca5a5;font-size:12px;margin-top:10px}
footer{border-top:1px solid #16161f;padding:24px 0;text-align:center;font-size:11px;color:#4a4a60}
/* Modals */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal.show{display:flex}
.modal-box{background:#0e0e18;border:1px solid #1e1e2e;border-radius:16px;padding:28px;max-width:400px;width:100%;max-height:90vh;overflow-y:auto}
.modal-box h2{font-size:18px;font-weight:700;margin-bottom:16px;text-align:center}
.modal-box input{width:100%;padding:11px 14px;background:#12121c;border:1px solid #1e1e2a;border-radius:8px;color:#e4e4ed;font-size:14px;outline:none;margin-bottom:10px;font-family:inherit}
.modal-box input:focus{border-color:#6366f1}
.modal-box .btn{width:100%;padding:11px;background:linear-gradient(135deg,#6366f1,#818cf8);border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:opacity .2s;margin-top:4px}
.modal-box .btn:hover{opacity:.85}
.modal-link{text-align:center;font-size:12px;color:#5a5a70;margin-top:12px;cursor:pointer}
.modal-link span{color:#818cf8}
.modal-close{position:absolute;top:12px;right:16px;font-size:20px;color:#5a5a70;cursor:pointer;background:none;border:none;font-family:inherit}
.modal-box{position:relative}
.pricing-grid{display:grid;gap:8px;margin:16px 0}
.pkg-card{background:#12121c;border:1px solid #1e1e2a;border-radius:10px;padding:14px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:space-between}
.pkg-card:hover{border-color:#3a3a50;background:#16161f}
.pkg-card.active{border-color:#6366f1;background:rgba(99,102,241,.08)}
.pkg-card .pkg-name{font-size:13px;font-weight:600;color:#e4e4ed}
.pkg-card .pkg-detail{font-size:11px;color:#6b6b80;margin-top:2px}
.pkg-card .pkg-price{font-size:16px;font-weight:700;color:#a5b4fc}
.pkg-card .pkg-price small{font-size:11px;font-weight:400;color:#6b6b80}
.pkg-card .pkg-badge{background:linear-gradient(135deg,#6366f1,#818cf8);border-radius:4px;padding:2px 6px;font-size:9px;color:#fff;margin-left:6px}
.qr-box{text-align:center;padding:16px 0}
.qr-box img{width:200px;height:200px;border:1px solid #1e1e2a;border-radius:8px;margin:12px auto;display:block}
.qr-box .qr-tip{font-size:11px;color:#5a5a70;margin-top:8px}
.redeem-row{display:flex;gap:8px;margin-top:14px}
.redeem-row input{flex:1;padding:9px 12px;background:#12121c;border:1px solid #1e1e2a;border-radius:8px;color:#e4e4ed;font-size:13px;outline:none;font-family:inherit}
.redeem-row input:focus{border-color:#6366f1}
.redeem-row button{padding:9px 16px;background:#16161f;border:1px solid #2a2a3a;border-radius:8px;color:#9d9db5;font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s}
.redeem-row button:hover{background:#1e1e2a;color:#e4e4ed}
.fade-in{animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.order-status{padding:12px;border-radius:8px;text-align:center;font-size:13px;margin-top:12px}
.order-status.pending{background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.2);color:#a5b4fc}
.order-status.success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);color:#86efac}
</style>
</head>
<body>
<header>
<div class="container">
<a href="#" class="logo"><span class="logo-icon">✦</span>AI 绘 <small>图片生成</small></a>
<div class="header-right" id="headerRight">
<div id="userInfo" style="display:none" class="user-badge">
<span id="userName" style="color:#9d9db5"></span>
<span class="credits">剩余 <strong id="creditCount">0</strong> 次</span>
<span class="credits">免费 <strong id="freeCount">3</strong>/3</span>
<button class="btn-outline" onclick="showPricing()">充值</button>
<button class="btn-outline" onclick="logout()">退出</button>
</div>
<div id="loginBtns">
<button class="btn-outline" onclick="showLogin()">登录</button>
<button class="btn-primary" onclick="showRegister()">注册</button>
</div>
</div>
</div>
</header>

<div class="container"><div class="ad-banner" onclick="alert('广告位招租')">📢 广告位招租</div></div>

<main class="container">
<div class="page-layout">
<div class="controls-panel">
<h2>生成图片</h2>
<div class="form-group"><label>选择模型</label>
<div class="model-options" id="modelOptions">
<button class="model-btn active" data-model="image2">GPT-image2<small>快速</small></button>
<button class="model-btn" data-model="nano_banana_2">Nano Banana 2<small>标准·高画质</small></button>
<button class="model-btn" data-model="nano_banana_pro-1K">Banana Pro<small>1K</small></button>
<button class="model-btn" data-model="nano_banana_pro-2K">Banana Pro<small>2K</small></button>
</div></div>
<div class="form-group"><label>描述画面</label>
<div class="prompt-wrap"><textarea id="prompt" placeholder="例如：一只可爱的橘猫坐在窗边，夕阳洒在它身上..." maxlength="10000"></textarea><span class="char-count" id="charCount">0/10000</span></div></div>
<div class="form-group" id="sizeGroup"><label>尺寸</label>
<div class="size-options" id="sizeOptions">
<button class="size-btn active" data-size="1024x1024">▢ 1:1</button>
<button class="size-btn" data-size="1024x1792">▯ 9:16</button>
<button class="size-btn" data-size="1792x1024">▬ 16:9</button>
</div></div>
<div class="form-group" id="ratioGroup" style="display:none"><label>比例</label>
<div class="size-options" id="ratioOptions">
<button class="size-btn active" data-ratio="1:1">1:1</button>
<button class="size-btn" data-ratio="9:16">9:16</button>
<button class="size-btn" data-ratio="16:9">16:9</button>
<button class="size-btn" data-ratio="auto">自动</button>
</div></div>
<div class="form-group"><label>数量</label>
<div class="size-options"><button class="size-btn active" data-n="1">1</button><button class="size-btn" data-n="2">2</button><button class="size-btn" data-n="4">4</button></div></div>
<button class="btn-generate" id="btnGenerate" onclick="generate()"><span class="spinner"></span><span class="btn-text">✨ 生成图片</span></button>
</div>

<div class="results-panel" id="resultsPanel">
<div class="empty-state" id="emptyState">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
<h3>登录后即可生成</h3><p>免费用户每天 3 次，注册即送</p></div>
<div id="resultArea"></div><div id="historyArea"></div>
</div>
</div>
</main>

<footer><div class="container"><p><a href="#">AI 绘</a> · 基于小扳手 API · © 2026</p></div></footer>

<!-- Login Modal -->
<div class="modal" id="loginModal"><div class="modal-box">
<button class="modal-close" onclick="hideModal('loginModal')">✕</button>
<h2>登录</h2>
<input type="text" id="loginUser" placeholder="用户名" autocomplete="username">
<input type="password" id="loginPass" placeholder="密码" autocomplete="current-password">
<button class="btn" onclick="doLogin()">登录</button>
<div class="modal-link">没有账号？<span onclick="switchAuth('register')">立即注册</span></div>
<div id="loginError" class="error-msg" style="display:none;margin-top:8px"></div>
</div></div>

<!-- Register Modal -->
<div class="modal" id="registerModal"><div class="modal-box">
<button class="modal-close" onclick="hideModal('registerModal')">✕</button>
<h2>注册</h2>
<input type="text" id="regUser" placeholder="用户名" autocomplete="username">
<input type="password" id="regPass" placeholder="密码（至少4位）" autocomplete="new-password">
<input type="password" id="regPass2" placeholder="确认密码">
<button class="btn" onclick="doRegister()">注册</button>
<div class="modal-link">已有账号？<span onclick="switchAuth('login')">立即登录</span></div>
<div id="regError" class="error-msg" style="display:none;margin-top:8px"></div>
</div></div>

<!-- Pricing Modal -->
<div class="modal" id="pricingModal"><div class="modal-box" style="max-width:440px">
<button class="modal-close" onclick="hideModal('pricingModal')">✕</button>
<h2>充值</h2>
<div class="pricing-grid" id="pricingGrid"></div>
<div id="payArea"></div>
<div class="redeem-row"><input type="text" id="redeemCode" placeholder="输入激活码"><button onclick="redeemCode()">兑换</button></div>
<div id="pricingError" class="error-msg" style="display:none;margin-top:8px"></div>
</div></div>

<script>
// === Auth State ===
let TOKEN = localStorage.getItem('ai_token') || '';
let USERNAME = localStorage.getItem('ai_username') || '';
let currentModel = 'image2', currentSize = '1024x1024', currentRatio = '1:1', currentN = 1;
let isGenerating = false, history = [], totalGenerated = 0;

// === Init ===
if (TOKEN) { fetchQuota(); showUserUI(); }

// === Auth UI ===
function showLogin() { document.getElementById('loginModal').classList.add('show'); document.getElementById('loginError').style.display='none'; }
function showRegister() { document.getElementById('registerModal').classList.add('show'); document.getElementById('regError').style.display='none'; }
function hideModal(id) { document.getElementById(id).classList.remove('show'); }
function switchAuth(type) { hideModal(type==='login'?'registerModal':'loginModal'); showLogin(); }

function showUserUI() {
  document.getElementById('loginBtns').style.display = 'none';
  document.getElementById('userInfo').style.display = 'flex';
  document.getElementById('userName').textContent = USERNAME;
  document.getElementById('emptyState').innerHTML = '<h3>输入描述，生成图片</h3><p>选择模型和尺寸后点击生成</p>';
}

function logout() {
  TOKEN = ''; USERNAME = '';
  localStorage.removeItem('ai_token'); localStorage.removeItem('ai_username');
  document.getElementById('loginBtns').style.display = '';
  document.getElementById('userInfo').style.display = 'none';
  location.reload();
}

// === Auth API ===
async function doRegister() {
  const u=document.getElementById('regUser').value.trim(), p1=document.getElementById('regPass').value, p2=document.getElementById('regPass2').value;
  if(p1!==p2) return showError('regError','两次密码不一致');
  const resp = await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p1})});
  const d=await resp.json();
  if(d.error) return showError('regError',d.error);
  hideModal('registerModal'); showLogin(); document.getElementById('loginUser').value=u; document.getElementById('loginPass').value='';
}

async function doLogin() {
  const u=document.getElementById('loginUser').value.trim(), p=document.getElementById('loginPass').value;
  const resp=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
  const d=await resp.json();
  if(d.error) return showError('loginError',d.error);
  TOKEN=d.token; USERNAME=d.username;
  localStorage.setItem('ai_token',TOKEN); localStorage.setItem('ai_username',USERNAME);
  hideModal('loginModal'); showUserUI(); fetchQuota();
}

function showError(id,msg){const el=document.getElementById(id);el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',3000)}

// === Quota ===
async function fetchQuota() {
  if(!TOKEN) return;
  try{
    const resp=await fetch('/api/quota',{headers:{'Authorization':'Bearer '+TOKEN}});
    const d=await resp.json();
    if(d.error) return;
    document.getElementById('creditCount').textContent=d.credits;
    document.getElementById('freeCount').textContent=d.dailyFree + '/' + 3;
  }catch(e){}
}

// === Pricing ===
async function showPricing() {
  const grid=document.getElementById('pricingGrid');
  const pkgs=[{id:'p1',name:'尝鲜包',price:'9.90',credits:15},{id:'p2',name:'畅享包',price:'19.90',credits:40},{id:'p3',name:'超值包',price:'49.90',credits:120},{id:'p4',name:'专业包',price:'99.00',credits:300}];
  grid.innerHTML=pkgs.map(p=>`<div class="pkg-card" onclick="selectPkg('${p.id}')" id="pkg-${p.id}">
    <div><div class="pkg-name">${p.name}</div><div class="pkg-detail">${p.credits} 次生图</div></div>
    <div class="pkg-price">${p.price}<small> 元</small></div>
  </div>`).join('');
  document.getElementById('payArea').innerHTML='';
  document.getElementById('pricingModal').classList.add('show');
}

let selectedPkg = null;
async function selectPkg(id) {
  document.querySelectorAll('.pkg-card').forEach(e=>e.classList.remove('active'));
  document.getElementById('pkg-'+id).classList.add('active');
  selectedPkg = id;
  const payArea=document.getElementById('payArea');
  payArea.innerHTML='<div class="order-status pending">正在创建订单...</div>';
  try{
    const resp=await fetch('/api/create-order',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify({package_id:id})});
    const d=await resp.json();
    if(d.error){payArea.innerHTML='<div class="error-msg">'+d.error+'</div>';return;}
    payArea.innerHTML='<div class="qr-box"><p style="font-size:13px;color:#9d9db5;margin-bottom:4px">微信扫码支付</p><img src="'+d.qrcode+'" alt="支付二维码"><p class="qr-tip">请使用微信扫码完成支付<br>支付成功后自动到账</p></div><div class="order-status pending" id="orderStatus">等待支付...</div>';
    pollOrder(d.order_id);
  }catch(e){payArea.innerHTML='<div class="error-msg">网络错误: '+e.message+'</div>';}
}

function pollOrder(orderId){
  const check=setInterval(async()=>{
    try{
      const resp=await fetch('/api/quota',{headers:{'Authorization':'Bearer '+TOKEN}});
      const d=await resp.json();
      const el=document.getElementById('orderStatus');
      if(el&&d.credits>0){el.textContent='✅ 支付成功！余额已到账';el.className='order-status success';clearInterval(check);fetchQuota();}
    }catch(e){}
  },3000);
  setTimeout(()=>clearInterval(check),180000);
}

// === Redeem ===
async function redeemCode() {
  const code=document.getElementById('redeemCode').value.trim();
  if(!code) return;
  try{
    const resp=await fetch('/api/redeem',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify({code})});
    const d=await resp.json();
    if(d.error) return showError('pricingError',d.error);
    document.getElementById('redeemCode').value='';
    fetchQuota();
    showError('pricingError','✅ '+d.message);
  }catch(e){showError('pricingError','请求失败');}
}

// === Generate ===
async function generate() {
  if(!TOKEN){showLogin();return;}
  const prompt=document.getElementById('prompt').value.trim();
  if(!prompt){document.getElementById('prompt').focus();return;}
  if(isGenerating) return;
  isGenerating=true;
  document.getElementById('btnGenerate').classList.add('loading');
  document.getElementById('btnGenerate').disabled=true;
  document.getElementById('emptyState').style.display='none';

  const isAsync=currentModel.startsWith('nano_banana');
  document.getElementById('resultArea').innerHTML='<div class="result-card fade-in"><div class="img-wrap"><div class="loading-overlay" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px;color:#5a5a70"><div style="width:36px;height:36px;border:3px solid #1e1e2a;border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite"></div><div style="font-size:13px">'+ (isAsync?'任务已提交，等待生成...':'正在生成...')+'</div></div></div></div>';
  try{
    const body={model:currentModel,prompt};
    if(currentModel==='image2'){body.size=currentSize;body.n=currentN;}
    else body.aspect_ratio=currentRatio;
    const resp=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify(body)});
    const data=await resp.json();
    if(resp.status===401){showLogin();return;}
    if(resp.status===402){isGenerating=false;document.getElementById('btnGenerate').classList.remove('loading');document.getElementById('btnGenerate').disabled=false;showPricing();return;}
    if(!resp.ok) throw new Error(data.error||'请求失败');

    if(currentModel==='image2'){
      if(!data.data||!data.data.length) throw new Error('返回数据为空');
      displayResults(data.data.map(d=>d.b64_json));
    }else{
      if(!data.id) throw new Error('任务提交失败');
      await pollTask(data.id);
    }
    fetchQuota();
  }catch(err){
    document.getElementById('resultArea').innerHTML='<div class="result-card fade-in"><div class="img-wrap" style="padding:40px;min-height:160px"><div class="error-msg">'+err.message+'</div></div></div>';
  }finally{
    isGenerating=false;document.getElementById('btnGenerate').classList.remove('loading');document.getElementById('btnGenerate').disabled=false;
  }
}

async function pollTask(taskId){/* polling logic from original */}
async function pollTask(taskId){
  for(let i=0;i<120;i++){
    await new Promise(r=>setTimeout(r,2000));
    try{
      const resp=await fetch('/api/query?id='+taskId);
      const data=await resp.json();
      const sl=document.querySelector('.status-text');
      if(sl){
        if(data.status==='queued')sl.textContent='排队中...';
        else if(data.status==='processing')sl.textContent='生成中 '+(data.progress||0)+'%';
        else if(data.status==='completed')sl.textContent='生成完成 ✓';
      }
      if(data.status==='completed'){displayResults([data.url]);return;}
      if(data.status==='failed')throw new Error(data.error?.message||'生成失败');
    }catch(e){if(e.message!=='生成失败')throw e;}
  }
  throw new Error('任务超时');
}

function displayResults(items){
  const images=items.map(s=>s.startsWith('data:')?s:(s.startsWith('http')?s:'data:image/png;base64,'+s));
  totalGenerated+=images.length;
  images.forEach(src=>history.unshift({src,prompt:document.getElementById('prompt').value.trim(),model:currentModel}));
  renderResults(images);renderHistory();
}

function renderResults(images){
  let html='';
  images.forEach((src,i)=>{
    const ps=document.getElementById('prompt').value.trim();
    html+=`<div class="result-card fade-in" style="${i>0?'margin-top:14px':''}"><div class="img-wrap"><img src="${src}" loading="lazy" onload="this.style.opacity=1" style="opacity:0;transition:opacity .3s"></div><div class="meta"><div class="left"><span class="model-badge">${currentModel==='image2'?'GPT-image2':currentModel}</span></div><div class="actions"><button onclick="downloadImage('${src}','ai-${Date.now()}-${i}')">⬇ 下载</button></div></div></div>`;
  });
  document.getElementById('resultArea').innerHTML=html;
}

function downloadImage(src,name){const a=document.createElement('a');a.href=src;a.download=name+'.png';document.body.appendChild(a);a.click();document.body.removeChild(a);}

function renderHistory(){
  if(!history.length)return;
  let html='<div class="history-section"><h3>历史记录</h3><div class="history-grid">';
  history.slice(0,12).forEach((item,i)=>{
    html+=`<div class="thumb fade-in" style="animation-delay:${i*30}ms" onclick="viewImage('${item.src}')"><img src="${item.src}" loading="lazy"><div class="thumb-overlay">查看</div></div>`;
  });
  html+='</div></div>';
  document.getElementById('historyArea').innerHTML=html;
}

function viewImage(src){
  document.getElementById('resultArea').innerHTML=`<div class="result-card fade-in"><div class="img-wrap"><img src="${src}" style="max-height:550px"></div><div class="meta"><div class="left"><span class="model-badge">历史</span></div><div class="actions"><button onclick="downloadImage('${src}','ai-${Date.now()}')">⬇ 下载</button></div></div></div>`;
}

// === UI Events ===
document.getElementById('prompt').addEventListener('input',()=>{const l=document.getElementById('prompt').value.length;document.getElementById('charCount').textContent=l+'/10000';});
document.querySelectorAll('#modelOptions .model-btn').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('#modelOptions .model-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentModel=b.dataset.model;document.getElementById('sizeGroup').style.display=currentModel==='image2'?'':'none';document.getElementById('ratioGroup').style.display=currentModel==='image2'?'none':'';})});
document.querySelectorAll('#sizeOptions .size-btn').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('#sizeOptions .size-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentSize=b.dataset.size;})});
document.querySelectorAll('#ratioOptions .size-btn').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('#ratioOptions .size-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentRatio=b.dataset.ratio;})});
document.querySelectorAll('[data-n]').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('[data-n]').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentN=parseInt(b.dataset.n);})});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();generate()}});
</script>
